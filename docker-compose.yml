version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: globalsmart
      POSTGRES_PASSWORD: globalsmart
      POSTGRES_DB: gshub
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      # Choose DB provider: sqlite or postgres
      SERVER_DB_PROVIDER: postgres
      # When using postgres (via docker-compose postgres service)
      DATABASE_URL: postgresql://globalsmart:globalsmart@postgres:5432/gshub?schema=public
      # Optional cloud toggles
      USE_CLOUD: "false"
      OPENAI_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      S3_ENDPOINT: ""
      S3_REGION: "us-east-1"
      S3_BUCKET: "globalsmarthub"
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      JWT_SECRET: dev_secret_change_me
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build: ./client
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  pg_data:
  server_node_modules:
  client_node_modules:
